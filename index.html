
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dollz Glam Studio 💋</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Pacifico&display=swap');

:root {
  --pink:#ff4fa3;
  --purple:#a45bdf;
  --dark:#51234d;
  --light:#fff0f8;
}
*{box-sizing:border-box}
body{
 margin:0;
 font-family:'Fredoka',sans-serif;
 color:var(--dark);
 background:linear-gradient(135deg,#ffe0f0,#e9d5ff,#fff0f8);
 min-height:100vh;
}
header{
 text-align:center;
 padding:22px 10px;
 background:linear-gradient(90deg,#ff65ae,#b56be8);
 color:white;
 box-shadow:0 4px 15px #a7478b44;
}
header h1{
 margin:0;
 font-size:clamp(27px,5vw,43px);
 text-shadow:2px 3px #a52b78;
}
header p{margin:5px;font-size:13px}
main{max-width:1100px;margin:25px auto;padding:12px}
.steps{
 display:flex;justify-content:center;gap:7px;
 flex-wrap:wrap;margin-bottom:20px;
}
.steps button,.button{
 border:0;border-radius:25px;padding:11px 17px;
 background:white;color:#a43d85;
 font-weight:bold;cursor:pointer;
 box-shadow:0 3px 8px #a7478b22;
}
.steps button.active,.button{
 background:linear-gradient(90deg,#ff53a5,#a75de0);
 color:white;
}
.game{
 display:grid;grid-template-columns:1fr 1fr;
 gap:20px;
}
.panel{
 background:#ffffffdc;border:2px solid white;
 border-radius:22px;padding:18px;
 box-shadow:0 7px 20px #a7478b18;
}
.panel h2{color:#d83b91;margin-top:0}
.doll-area{
 min-height:450px;border-radius:18px;
 background:radial-gradient(circle,#fff 0%,#ffd9ed 70%,#e8d8ff);
 display:flex;align-items:center;justify-content:center;
 position:relative;overflow:hidden;
}
.doll-area:after{
 content:"✦ ♡ ✧ ♡ ✦";
 position:absolute;top:15px;
 color:#e88bc0;letter-spacing:20px;
}
svg{width:min(100%,350px);height:auto;z-index:1}
.controls{display:flex;flex-wrap:wrap;gap:9px;margin:12px 0 22px}
.option{
 padding:10px 13px;border:2px solid #f2c5df;
 border-radius:12px;background:#fff8fc;
 color:#843a70;cursor:pointer;font-family:inherit;
}
.option.selected{border-color:#e53d99;background:#ffe0f1}
.swatch{
 width:35px;height:35px;border-radius:50%;
 border:3px solid white;box-shadow:0 0 0 1px #d9a4c5;
 cursor:pointer;
}
.swatch.selected{box-shadow:0 0 0 3px #e83e9a}
.label{font-weight:bold;font-size:13px;margin-top:18px}
.actions{display:flex;justify-content:space-between;gap:10px;margin-top:20px}
.score{text-align:center;font-size:17px;color:#c72d86}
.hidden{display:none}
#message{text-align:center;color:#c72d86;font-weight:bold}
footer{text-align:center;padding:25px;color:#a04d88;font-size:12px}
@media(max-width:720px){
 .game{grid-template-columns:1fr}
 .doll-area{min-height:390px}
 .panel{padding:14px}
}
</style>
</head>
<body>

<header>
<h1>💋 DOLLZ GLAM STUDIO 💋</h1>
<p>Be fabulous. Be fearless. Create your dream doll!</p>
</header>

<main>
<nav class="steps">
<button class="active" onclick="go(0)">01 Doll</button>
<button onclick="go(1)">02 Makeup</button>
<button onclick="go(2)">03 Hair</button>
<button onclick="go(3)">04 Fashion</button>
<button onclick="go(4)">05 Showcase</button>
</nav>

<div class="game">
<section class="panel">
<h2>♡ Your Fashion Doll ♡</h2>
<div class="doll-area" id="dollArea">
<svg id="doll" viewBox="0 0 300 460">
<defs>
<linearGradient id="skin" x2="1" y2="1">
<stop stop-color="#f8c6a5"/>
<stop offset="1" stop-color="#d99b7d"/>
</linearGradient>
</defs>

<!-- Hair behind -->
<path id="backHair" d="M75 115 Q40 5 150 20 Q260 5 225 115 L250 320 Q220 360 210 220 L90 220 Q80 350 50 320Z" fill="#35202e"/>

<!-- Legs -->
<path d="M112 300 L145 300 L137 415 L105 415Z" fill="url(#skin)"/>
<path d="M155 300 L188 300 L195 415 L163 415Z" fill="url(#skin)"/>

<!-- Shoes -->
<g id="shoes">
<path d="M104 407 L138 407 L140 430 L90 430 Q88 420 104 407Z" fill="#ff53a5"/>
<path d="M164 407 L197 407 L212 430 L160 430Z" fill="#ff53a5"/>
</g>

<!-- Body and arms -->
<path d="M115 175 L185 175 L215 315 L85 315Z" fill="url(#skin)"/>
<path d="M112 185 Q90 195 78 270 L65 305 Q60 320 74 322 Q86 321 91 300 L135 215Z" fill="url(#skin)"/>
<path d="M188 185 Q210 195 222 270 L235 305 Q240 320 226 322 Q214 321 209 300 L165 215Z" fill="url(#skin)"/>

<!-- Outfit -->
<g id="outfit">
<path d="M115 178 Q150 160 185 178 L210 300 L90 300Z" fill="#ff4fa3"/>
<path d="M90 300 L210 300 L195 340 L105 340Z" fill="#65a5d9"/>
</g>

<!-- Neck -->
<path d="M132 145 L168 145 L168 185 L132 185Z" fill="url(#skin)"/>

<!-- Face -->
<ellipse cx="150" cy="108" rx="63" ry="76" fill="url(#skin)"/>

<!-- Hair front -->
<path id="frontHair" d="M87 110 Q65 15 150 22 Q235 15 213 110 Q190 70 170 72 Q145 93 120 70 Q100 82 87 110Z" fill="#35202e"/>

<!-- Eyes -->
<path d="M105 106 Q125 88 140 106 Q125 128 105 106Z" fill="white"/>
<path d="M160 106 Q175 88 195 106 Q175 128 160 106Z" fill="white"/>
<circle id="eye1" cx="123" cy="106" r="8" fill="#6b91a9"/>
<circle id="eye2" cx="177" cy="106" r="8" fill="#6b91a9"/>
<circle cx="125" cy="105" r="3" fill="#211"/>
<circle cx="179" cy="105" r="3" fill="#211"/>
<path d="M103 98 Q125 83 141 98 M159 98 Q178 83 197 98" stroke="#351b2c" stroke-width="5" fill="none" stroke-linecap="round"/>

<!-- Blush -->
<ellipse id="blush1" cx="105" cy="140" rx="15" ry="7" fill="#ef789a" opacity=".4"/>
<ellipse id="blush2" cx="195" cy="140" rx="15" ry="7" fill="#ef789a" opacity=".4"/>

<!-- Lips -->
<path id="lips" d="M135 153 Q150 143 150 151 Q165 143 165 153 Q150 173 135 153Z" fill="#dc4c85"/>

<!-- Necklace -->
<path id="necklace" d="M125 180 Q150 208 175 180" stroke="#f5d36b" stroke-width="3" fill="none"/>

<!-- Accessories -->
<g id="earrings" fill="#f5d36b">
<circle cx="87" cy="135" r="5"/><circle cx="213" cy="135" r="5"/>
</g>
<g id="glasses" display="none" stroke="#a44cbb" stroke-width="4" fill="none">
<rect x="96" y="91" width="47" height="29" rx="9"/>
<rect x="157" y="91" width="47" height="29" rx="9"/>
<path d="M143 102 L157 102"/>
</g>
<g id="bag" display="none">
<path d="M207 260 L250 260 L255 320 L205 320Z" fill="#f65ca9" stroke="#9b3677" stroke-width="3"/>
<path d="M215 260 Q215 230 230 230 Q245 230 245 260" stroke="#f2c96d" stroke-width="4" fill="none"/>
</g>
</svg>
</div>
<p id="message">Your doll is waiting for her makeover! ♡</p>
</section>

<section class="panel">
<h2 id="stageTitle">Create Your Doll ✨</h2>
<p id="stageDescription">Choose your doll's features.</p>
<div id="controls"></div>
<div class="actions">
<button class="button" onclick="previous()">← Back</button>
<button class="button" onclick="next()">Next →</button>
</div>
</section>
</div>

<section class="panel" style="margin-top:18px">
<div class="score">💗 STYLE SCORE: <span id="score">0</span> / 100</div>
</section>
</main>

<footer>DOLLZ GLAM STUDIO 💋 · YOUR STYLE, YOUR RULES · Y2K FOREVER</footer>

<script>
let stage=0;
let choices={
skin:0,eye:0,lip:0,blush:0,shadow:0,
hair:0,hairColor:0,top:0,bottom:0,shoes:0,
bag:false,glasses:false,earrings:true,necklace:true,
liner:false,mascara:false
};

const stages=[
{
title:"Create Your Doll ✨",
description:"Choose your doll's appearance.",
groups:[
["Skin Tone","skin",["Porcelain","Honey","Caramel","Mocha","Deep Cocoa"]],
["Eye Color","eye",["Blue","Green","Violet","Brown","Dark"]]
]},
{
title:"Makeup Studio 💄",
description:"Give your doll a gorgeous glam look.",
groups:[
["Lipstick","lip",["Rose","Pink","Berry","Plum","Peach","Cherry","Mauve","Gloss"]],
["Eyeshadow","shadow",["Pink","Purple","Blue","Silver","Gold","Berry","Lavender","Peach"]],
["Blush","blush",["Petal","Rosy","Coral","Peach","Mauve"]],
["Eyeliner","liner",["Off","Winged"]],
["Mascara","mascara",["Natural","Extra"]]
]},
{
title:"Hair Salon 💇‍♀️",
description:"Choose a hairstyle and hair color.",
groups:[
["Hairstyle","hair",["Straight","Curly","Wavy","High Ponytail","Braids","Short Bob","Space Buns","Pigtails"]],
["Hair Color","hairColor",["Espresso","Brown","Blonde","Pink","Purple","Silver","Auburn","Black"]]
]},
{
title:"Fashion Studio 👗",
description:"Mix and match your Y2K outfit.",
groups:[
["Tops","top",["Pink Crop Top","Purple Halter","Silver Top","Leopard Top","Black Jacket"]],
["Bottoms","bottom",["Flared Jeans","Mini Skirt","Pink Cargos","Purple Flares"]],
["Shoes","shoes",["Pink Platforms","Silver Boots","Purple Heels"]],
["Handbag","bag",["No Bag","Handbag"]],
["Sunglasses","glasses",["No Shades","Sunglasses"]],
["Earrings","earrings",["No Earrings","Earrings"]],
["Necklace","necklace",["No Necklace","Necklace"]]
]}
];

const colors={
skin:["#f8c6a5","#e9aa86","#c98260","#985b43","#633b32"],
eye:["#6b91a9","#6b9d73","#7450a0","#75472f","#273044"],
lip:["#dc4c85","#f25a9c","#b72b62","#a33c9c","#ed826e","#c72b42","#9a4d73","#f19bb8"],
shadow:["#f1a4ce","#a77cce","#74a9d4","#c8c8d5","#e9c16d","#b65e92","#8c75a9","#e9a8a0"],
blush:["#f6a0aa","#e77b91","#d96c78","#f4b1a0","#d78baf"],
hairColor:["#35202e","#7b3f24","#e2b65f","#d94f83","#9b75c9","#c9c5d3","#b33c38","#17151e"],
top:["#ff4fa3","#9b65cf","#c7c8d5","#8d5138","#24202d"],
bottom:["#78bce8","#f15aa7","#bd83d7","#8067bb"],
shoes:["#ff53a5","#bfc5d8","#9b65cf"]
};

function render(){
 document.querySelectorAll(".steps button").forEach((b,i)=>b.classList.toggle("active",i===stage));
 const title=document.getElementById("stageTitle");
 const desc=document.getElementById("stageDescription");
 const controls=document.getElementById("controls");
 controls.innerHTML="";

 if(stage===4){showcase();return}
 title.textContent=stages[stage].title;
 desc.textContent=stages[stage].description;

 stages[stage].groups.forEach(([label,key,options])=>{
  const heading=document.createElement("div");
  heading.className="label";
  heading.textContent=label;
  controls.appendChild(heading);
  const row=document.createElement("div");
  row.className="controls";

  options.forEach((option,i)=>{
   const b=document.createElement("button");
   const isToggle=["bag","glasses","earrings","necklace","liner","mascara"].includes(key);
   if(colors[key]){
    b.className="swatch"+(choices[key]===i?" selected":"");
    b.style.background=colors[key][i];
    b.title=option;
   }else{
    b.className="option"+((isToggle?(choices[key] === (i===1)):choices[key]===i)?" selected":"");
    b.textContent=option;
   }
   b.onclick=()=>{
    choices[key]=isToggle?i===1:i;
    render();
    updateDoll();
    updateScore();
   };
   row.appendChild(b);
  });
  controls.appendChild(row);
 });
}

function updateDoll(){
 const doll=document.getElementById("doll");
 const skin=colors.skin[choices.skin];
 doll.querySelectorAll("path,ellipse").forEach(el=>{
  if(el.getAttribute("fill")==="url(#skin)")el.setAttribute("fill",skin);
 });
 doll.querySelectorAll("#eye1,#eye2").forEach(e=>e.setAttribute("fill",colors.eye[choices.eye]));
 doll.querySelector("#lips").setAttribute("fill",colors.lip[choices.lip]);
 doll.querySelector("#blush1").setAttribute("fill",colors.blush[choices.blush]);
 doll.querySelector("#blush2").setAttribute("fill",colors.blush[choices.blush]);
 doll.querySelector("#frontHair").setAttribute("fill",colors.hairColor[choices.hairColor]);
 doll.querySelector("#backHair").setAttribute("fill",colors.hairColor[choices.hairColor]);

 const hairstyles=[
 "M75 115 Q40 5 150 20 Q260 5 225 115 L250 320 Q220 360 210 220 L90 220 Q80 350 50 320Z",
 "M75 115 Q30 5 150 20 Q270 5 225 115 Q275 220 240 330 Q215 370 210 230 L90 230 Q85 370 60 330 Q25 220 75 115Z",
 "M75 115 Q40 5 150 20 Q260 5 225 115 L245 290 Q225 320 210 220 L90 220 Q75 320 55 290Z",
 "M75 115 Q40 5 150 20 Q260 5 225 115 L230 190 L70 190Z",
 "M75 115 Q40 5 150 20 Q260 5 225 115 L250 300 L220 330 L210 220 L90 220 L80 330 L50 300Z",
 "M75 115 Q40 5 150 20 Q260 5 225 115 L225 220 L75 220Z",
 "M75 115 Q40 5 150 20 Q260 5 225 115 L245 190 L55 190Z",
 "M75 115 Q40 5 150 20 Q260 5 225 115 L240 250 L60 250Z"
 ];
 doll.querySelector("#backHair").setAttribute("d",hairstyles[choices.hair]);
 doll.querySelector("#earrings").style.display=choices.earrings?"":"none";
 doll.querySelector("#necklace").style.display=choices.necklace?"":"none";
 doll.querySelector("#glasses").style.display=choices.glasses?"":"none";
 doll.querySelector("#bag").style.display=choices.bag?"":"none";
 doll.querySelector("#outfit").querySelectorAll("path")[0].setAttribute("fill",colors.top[choices.top]);
 doll.querySelector("#outfit").querySelectorAll("path")[1].setAttribute("fill",colors.bottom[choices.bottom]);
 doll.querySelector("#shoes").querySelectorAll("path").forEach(p=>p.setAttribute("fill",colors.shoes[choices.shoes]));
 document.getElementById("message").textContent="Serving looks! ✨";
}

function updateScore(){
 let s=0;
 s+=20;
 s+=25;
 s+=15;
 s+=25;
 s+=15;
 document.getElementById("score").textContent=s;
}

function go(n){
 stage=Math.max(0,Math.min(4,n));
 render();
}
function next(){go(stage===4?0:stage+1)}
function previous(){go(stage-1)}

function showcase(){
 document.getElementById("stageTitle").textContent="The Final Showcase 📸";
 document.getElementById("stageDescription").textContent="Your doll is ready for her big moment!";
 document.getElementById("controls").innerHTML=`
 <div class="label">YOUR FINAL STYLE RATING</div>
 <h1 style="color:#e53d99;font-size:45px;text-align:center">100 / 100 💗</h1>
 <p style="text-align:center">You are a certified fashion icon!</p>
 <div class="label">PHOTOSHOOT BACKGROUND</div>
 <div class="controls">
 <button class="option" onclick="background('#ffe0f0')">Pink</button>
 <button class="option" onclick="background('#e7d9ff')">Purple</button>
 <button class="option" onclick="background('#e1f4ff')">Blue</button>
 <button class="option" onclick="background('#fff0c9')">Gold</button>
 </div>
 <div class="controls">
 <button class="option" onclick="runway()">Fashion Runway ✨</button>
 <button class="option" onclick="saveDoll()">Save Doll PNG ↓</button>
 </div>
 <p style="text-align:center">♡ Thanks for playing Dollz Glam Studio! ♡</p>`;
 document.getElementById("message").textContent="THE GLAM QUEEN HAS ARRIVED! 💋";
}
function background(color){
 document.getElementById("dollArea").style.background=`radial-gradient(circle,#fff,${color})`;
}
function runway(){
 const area=document.getElementById("dollArea");
 area.style.background="linear-gradient(90deg,#24112e,#6d285d,#24112e)";
 const doll=document.getElementById("doll");
 doll.animate([{transform:"translateY(0) rotate(-2deg)"},{transform:"translateY(-15px) rotate(2deg)"},{transform:"translateY(0) rotate(-2deg)"}],{duration:1100,iterations:3});
}
function saveDoll(){
 const svg=document.getElementById("doll").cloneNode(true);
 svg.setAttribute("xmlns","http://www.w3.org/2000/svg");
 const xml=new XMLSerializer().serializeToString(svg);
 const url=URL.createObjectURL(new Blob([xml],{type:"image/svg+xml"}));
 const img=new Image();
 img.onload=()=>{
  const canvas=document.createElement("canvas");
  canvas.width=600;canvas.height=920;
  const ctx=canvas.getContext("2d");
  ctx.fillStyle="#ffe0f0";ctx.fillRect(0,0,600,920);
  ctx.drawImage(img,0,0,600,920);
  const a=document.createElement("a");
  a.download="my-dollz-glam.png";
  a.href=canvas.toDataURL("image/png");
  a.click();
  URL.revokeObjectURL(url);
 };
 img.src=url;
}
render();
updateDoll();
updateScore();
</script>
</body>
</html>
